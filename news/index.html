<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public News | IAM Local 1720</title>
  <meta name="description" content="IAM Local 1720 news and updates">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <!-- Markdown parser for post body -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<main>
  <section class="hero compact">
    <h1>News & Updates</h1>
    <p>Stay up to date with the latest public news, announcements, and events from Local 1720.</p>
  </section>

  <section class="content-shell">
    <div id="news-container">Loading news...</div>
  </section>
</main>

<script>
  async function loadNews() {
    const container = document.getElementById("news-container");
    try {
      const response = await fetch('/news.json?v=' + Date.now());
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: Unable to load news.json`);
      }

      const data = await response.json();

      if (!data.posts || data.posts.length === 0) {
        container.innerHTML = "<p>No posts published yet.</p>";
        return;
      }

      container.innerHTML = "";

      data.posts
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .forEach(post => {
          const article = document.createElement("article");
          article.className = "feature-card news-card";
          article.style.marginBottom = "2rem";

      // 1. Cover Image (not clickable)
      if (post.image) {
        const img = document.createElement("img");
        img.src = post.image.startsWith('/') ? post.image : '/' + post.image;
        img.alt = post.title || "";
        img.style.width = "100%";
        img.style.maxWidth = "250px";
        img.style.height = "auto";
        img.style.display = "block";
        img.style.margin = "0 auto 1rem auto";
        img.style.borderRadius = "8px";
        article.appendChild(img);
      }
      
      // 2. Timestamp (smaller, subtle)
      if (post.date) {
        const date = document.createElement("p");
        date.style.fontSize = "0.8rem";
        date.style.fontWeight = "400";
        date.style.color = "#666";
        date.style.opacity = "0.85";
        date.style.margin = "0 0 0.35rem 0";
        date.style.letterSpacing = "0.3px";

        date.textContent = new Date(post.date).toLocaleDateString(undefined, {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        article.appendChild(date);
      }

      // 3. Title
      if (post.title) {
        const title = document.createElement("h2");
        title.textContent = post.title;
        article.appendChild(title);
      }
      
      // 4. Markdown Body + Clickable Inline Images
      if (post.body) {
        const bodyDiv = document.createElement("div");
        bodyDiv.className = "news-body";
        bodyDiv.innerHTML = marked.parse(post.body);

        // Make inline images clickable + open full-size in SAME window
        bodyDiv.querySelectorAll("img").forEach(img => {
          let src = img.getAttribute("src");

          // Fix relative paths
          if (src && !src.startsWith("http") && !src.startsWith("/")) {
            src = "/" + src;
            img.src = src;
          }

          // Wrap image in clickable link
          const link = document.createElement("a");
          link.href = src;
          link.style.display = "block";
          link.style.textDecoration = "none";

          img.parentNode.insertBefore(link, img);
          link.appendChild(img);

          // Responsive styling
          img.style.maxWidth = "100%";
          img.style.height = "auto";
          img.style.display = "block";
          img.style.margin = "1rem auto";
          img.style.borderRadius = "6px";
        });

        article.appendChild(bodyDiv);
      }

      container.appendChild(article);

    }); // End forEach
    } catch (err) {
      console.error("News Load Error:", err);
      container.innerHTML = `<p style="color:red;">Error loading news posts: ${err.message}</p>`;
    }
  }

  loadNews();
</script>

<script src="../assets/js/site.js"></script>
</body>
</html>
