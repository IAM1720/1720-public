<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public News | IAM Local 1720</title>
  <meta name="description" content="IAM Local 1720 news and updates">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <!-- Markdown parser for post body -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<main>
  <section class="hero compact">
    <h1>News & Updates</h1>
    <p>Stay up to date with the latest public news, announcements, and events from Local 1720.</p>
  </section>

  <section class="content-shell">
    <div id="news-container">Loading news...</div>
  </section>
</main>

<script>
  async function loadNews() {
    const container = document.getElementById("news-container");
    try {
      // Fetch news.json relative to domain root
      const response = await fetch('/news.json?v=' + Date.now());
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: Unable to load news.json`);
      }

      const data = await response.json();

      if (!data.posts || data.posts.length === 0) {
        container.innerHTML = "<p>No posts published yet.</p>";
        return;
      }

      container.innerHTML = "";

      // Sort newest posts first
      data.posts
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .forEach(post => {
          const article = document.createElement("article");
          article.className = "feature-card news-card";
          article.style.marginBottom = "2rem";

      // 1. Cover Image (Fluid Mobile Scaling)
      if (post.image) {
        const img = document.createElement("img");
        img.src = post.image.startsWith('/') ? post.image : '/' + post.image;
        img.alt = post.title || "";
        img.style.width = "100%";          // Scales fluidly on small screens
        img.style.maxWidth = "250px";       // Prevents image from getting too large on desktop
        img.style.height = "auto";          // Maintains aspect ratio
        img.style.display = "block";
        img.style.margin = "0 auto 1rem auto";
        img.style.borderRadius = "8px";
        article.appendChild(img);
      }
      
      // 2. Post Title
      if (post.title) {
        const title = document.createElement("h2");
        title.textContent = post.title;
        article.appendChild(title);
      }
      
      // 3. Formatted Date
      if (post.date) {
        const date = document.createElement("p");
        date.style.fontWeight = "bold";
        date.style.opacity = "0.75";
        date.style.margin = "0.25rem 0 1rem 0";
        date.textContent = new Date(post.date).toLocaleDateString(undefined, {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
        article.appendChild(date);
      }
      
     // 4. Markdown Body & Inline Image Mobile Rules
      if (post.body) {
        const bodyDiv = document.createElement("div");
        bodyDiv.className = "news-body";
        bodyDiv.innerHTML = marked.parse(post.body);
      
        // Responsive styling for images inside post body
        bodyDiv.querySelectorAll("img").forEach(img => {
          const src = img.getAttribute("src");
          if (src && !src.startsWith("http") && !src.startsWith("/")) {
            img.src = "/" + src;
          }
          img.style.maxWidth = "100%";       // Fits inside card padding
          img.style.height = "auto";         // Prevents distortion
          img.style.display = "block";
          img.style.margin = "1rem auto";
          img.style.borderRadius = "6px";
        });
      
        article.appendChild(bodyDiv);
      }

      // ADD THIS LINE HERE:
      container.appendChild(article);

    }); // End of forEach loop
    } catch (err) {
      console.error("News Load Error:", err);
      container.innerHTML = `<p style="color:red;">Error loading news posts: ${err.message}</p>`;
    }
  }

  loadNews();
</script>

<script src="../assets/js/site.js"></script>
</body>
</html>
