<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local 1720 News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 20px; }
    .post { margin-bottom: 40px; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
    .post img { max-width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Local 1720 News</h1>
  <div id="posts"></div>

  <script>
    async function loadPosts() {
      const response = await fetch('/news/');
      const text = await response.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'text/html');

      const links = [...doc.querySelectorAll('a')]
        .map(a => a.getAttribute('href'))
        .filter(href => href.endsWith('.md'));

      const posts = [];

      for (const link of links) {
        const md = await fetch('/news/' + link).then(r => r.text());

        const fmMatch = md.match(/---([\s\S]*?)---/);
        const fm = fmMatch ? fmMatch[1] : '';
        const body = md.replace(fmMatch[0], '');

        const fmObj = Object.fromEntries(
          fm.split('\n')
            .filter(line => line.includes(':'))
            .map(line => {
              const [key, ...rest] = line.split(':');
              return [key.trim(), rest.join(':').trim()];
            })
        );

        posts.push({
          title: fmObj.title || 'Untitled',
          date: fmObj.date || '',
          image: fmObj.image || '',
          body
        });
      }

      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      const container = document.getElementById('posts');
      posts.forEach(post => {
        const div = document.createElement('div');
        div.className = 'post';
        div.innerHTML = `
          <h2>${post.title}</h2>
          <p><em>${post.date}</em></p>
          ${post.image ? `<img src="${post.image}" alt="">` : ''}
          <p>${post.body}</p>
        `;
        container.appendChild(div);
      });
    }

    loadPosts();
  </script>
</body>
</html>
