<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News</title>
  <!-- Load Marked.js to parse Markdown into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>Latest News</h1>
  <div id="news-container">Loading news...</div>

  <script>
    const REPO = "IAM1720/1720-public";
    const FOLDER = "news";

    async function loadNews() {
      const container = document.getElementById("news-container");
      try {
        // 1. Get list of files from GitHub
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`);
        const files = await res.json();

        // Filter for .md files
        const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();

        if (mdFiles.length === 0) {
          container.innerHTML = "<p>No posts found.</p>";
          return;
        }

        container.innerHTML = "";

        // 2. Fetch and render each Markdown file
        for (const file of mdFiles) {
          const rawRes = await fetch(file.download_url);
          const rawText = await rawRes.text();

          // Split YAML frontmatter from content
          const parts = rawText.split(/^---$/m);
          const markdownBody = parts.length >= 3 ? parts.slice(2).join("---") : rawText;

          const article = document.createElement("article");
          article.innerHTML = marked.parse(markdownBody);
          container.appendChild(article);
        }
      } catch (err) {
        container.innerHTML = "<p>Error loading news posts.</p>";
        console.error(err);
      }
    }

    loadNews();
  </script>
</body>
</html>
