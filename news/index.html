<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local 1720 News</title>

  <link rel="stylesheet" href="/assets/css/styles.css">

  <style>
    .news-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .news-title {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 30px;
      color: var(--text);
    }

    .news-card {
      background: var(--card-bg);
      color: var(--text);
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .news-card h2 {
      margin-top: 0;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .news-date {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .news-card img {
      max-width: 100%;
      border-radius: 8px;
      margin: 15px 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
</head>
<body>

<div class="news-wrapper">
  <h1 class="news-title">
