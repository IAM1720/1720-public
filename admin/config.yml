backend:
  name: github
  repo: IAM1720/1720-public
  branch: main
  base_url: https://decap-oauth-provider.sectreas1720.workers.dev
  auth_endpoint: auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "news_data"
    label: "News Manager"
    files:
      - file: "news.json"
        label: "News Posts"
        name: "news"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Publish Date", name: "date", widget: "datetime" }
              - { label: "Cover Image", name: "image", widget: "image", required: false }
              - { label: "Body", name: "body", widget: "markdown" }
